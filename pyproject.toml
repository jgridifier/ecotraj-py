[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecotrajpy"
version = "0.1.0"
description = "Clean-room Python port of Ecological Trajectory Analysis (ETA) metrics, validated against the R package ecotraj 1.2.2"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "jgridifier"}]
keywords = [
    "ecological-trajectory-analysis",
    "trajectory",
    "directionality",
    "compositional-data",
    "ecotraj",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0"]

[project.optional-dependencies]
fast = ["numba>=0.58"]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://jgridifier.github.io/ecotraj-py/"
Documentation = "https://jgridifier.github.io/ecotraj-py/"
Repository = "https://github.com/jgridifier/ecotraj-py"
Issues = "https://github.com/jgridifier/ecotraj-py/issues"
Changelog = "https://github.com/jgridifier/ecotraj-py/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long simulations (deselect with -m 'not slow')"]
